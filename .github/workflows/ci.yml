name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and CLI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Dion
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI startup
        run: dion --help

  package:
    name: Package installation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install wheel and check CLI outside checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import venv
          root = Path(os.environ["RUNNER_TEMP"]) / "dion-wheel-venv"
          venv.create(root, with_pip=True)
          scripts = root / ("Scripts" if os.name == "nt" else "bin")
          python = scripts / ("python.exe" if os.name == "nt" else "python")
          wheel = next(Path("dist").glob("*.whl")).resolve()
          subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True)
          cli = scripts / ("dion.exe" if os.name == "nt" else "dion")
          subprocess.run([str(cli), "--help"], cwd=os.environ["RUNNER_TEMP"], check=True)

  windows-binary:
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and smoke test executable
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dion-windows
          path: dist/dion-windows.zip
