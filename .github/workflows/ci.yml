name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and CLI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Dion
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI startup
        run: dion --help

  package:
    name: Package installation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install wheel and check CLI outside checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import venv
          root = Path(os.environ["RUNNER_TEMP"]) / "dion-wheel-venv"
          venv.create(root, with_pip=True)
          scripts = root / ("Scripts" if os.name == "nt" else "bin")
          python = scripts / ("python.exe" if os.name == "nt" else "python")
          wheel = next(Path("dist").glob("*.whl")).resolve()
          subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True)
          cli = scripts / ("dion.exe" if os.name == "nt" else "dion")
          subprocess.run([str(cli), "--help"], cwd=os.environ["RUNNER_TEMP"], check=True)

  binary:
    name: Binary installation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dion-linux
            path: dist/dion
          - os: windows-latest
            artifact: dion-windows
            path: dist/dion-windows.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: ./build.sh
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1
      - name: Install binary and check startup outside checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import zipfile
          root = Path(os.environ["RUNNER_TEMP"]) / "dion-binary-install"
          root.mkdir()
          env = dict(os.environ)
          if os.name == "nt":
              with zipfile.ZipFile("dist/dion-windows.zip") as archive:
                  archive.extractall(root)
              cli = root / "dion" / "dion.exe"
          else:
              cli = root / "dion"
              shutil.copy2("dist/dion", cli)
              env["XDG_CACHE_HOME"] = str(root / "cache")
          # Check both first launch and a subsequent launch (Unix cache reuse).
          for _ in range(2):
              subprocess.run([str(cli), "--help"], cwd=root, env=env, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
