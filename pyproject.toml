[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dion"
version = "0.1.0"
description = "A terminal-based streaming and downloading tool for movies and TV shows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "questionary>=2.0.0",
]

[project.scripts]
dion = "dion.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dion*"]

